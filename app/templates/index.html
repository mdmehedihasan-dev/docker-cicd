<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Student Attendance App</title>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .btn-hover { transition: all 0.3s ease; }
        .btn-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(255, 255, 255, 0.3); }
        /* Dark mode scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-indigo-950 to-slate-900 text-white min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    
    <!-- decorative background blobs -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-pulse"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-[100px] opacity-40 animate-pulse" style="animation-delay: 2s;"></div>

    <div class="glass-panel p-10 rounded-3xl max-w-4xl w-full text-center relative z-10">
        
        <h2 class="text-4xl md:text-5xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-300 to-purple-300 drop-shadow-sm mb-3">Attendance Portal</h2>
        <p class="text-indigo-200/80 font-light text-lg mb-10">A sleek, simple, and powerful attendance tracking system.</p>
        
        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center max-w-lg mx-auto">
            <input id="studentName" type="text" placeholder="Enter Student Name..." 
                class="w-full bg-white/5 border border-white/10 text-white px-5 py-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition placeholder-gray-400 text-lg shadow-inner">
            <button onclick="registerStudent()" 
                class="btn-hover w-full sm:w-auto bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 text-white font-semibold px-8 py-4 rounded-xl shadow-lg shadow-indigo-500/25">
                Register
            </button>
        </div>
        
        <p id="successMessage" class="text-emerald-400 text-sm font-medium mt-4 h-5 hidden transition-all duration-300"></p>

        <div class="mt-12 bg-black/20 rounded-2xl border border-white/10 p-6 backdrop-blur-md">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                <h3 class="text-2xl font-semibold text-white/90">Recent Records</h3>
                <div class="flex gap-3 w-full sm:w-auto">
                    <button onclick="fetchAttendance()" 
                        class="btn-hover flex-1 sm:flex-none bg-white/10 hover:bg-white/20 text-white px-5 py-2.5 rounded-xl text-sm font-medium border border-white/5 transition flex items-center justify-center gap-2">
                        <span>⟳</span> Refresh
                    </button>
                    <button onclick="location.href='/analytics'" 
                        class="btn-hover flex-1 sm:flex-none bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                        <span>📊</span> Analytics
                    </button>
                </div>
            </div>
            <div id="attendanceTable" class="w-full overflow-x-auto rounded-xl border border-white/5 bg-white/5">
                <!-- table loads here -->
            </div>
        </div>
    </div>

    <script>
        function registerStudent() {
            let name = document.getElementById("studentName").value;
            fetch("/register_student", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("successMessage").textContent = data.message;
                document.getElementById("successMessage").classList.remove("hidden");
                document.getElementById("studentName").value = "";
                fetchAttendance();  // Refresh attendance records
                setTimeout(() => document.getElementById("successMessage").classList.add("hidden"), 3000);
            });
        }

        function fetchAttendance() {
            fetch("/get_attendance")
                .then(response => response.text())
                .then(html => {
                    document.getElementById("attendanceTable").innerHTML = html;
                });
        }

        function markAbsent(studentId) {
            fetch("/mark_absent", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ student_id: studentId })
            })
            .then(response => response.json())
            .then(data => {
                fetchAttendance(); // Refresh attendance table
            });
        }
        
        // Initial load
        window.onload = fetchAttendance;
    </script>

</body>
</html>
